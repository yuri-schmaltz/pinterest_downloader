<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f9f9f9;
      color: #333;
      text-align: center;
    }
    h2 {
      font-size: 15px;
      margin: 0 0 12px 0;
      color: #e60023;
    }
    button.primary {
      background: #e60023;
      color: white;
      border: none;
      padding: 10px 14px;
      width: 100%;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.2s;
    }
    button.primary:hover { background: #ad081b; }
    button.primary:disabled {
      background: #888;
      cursor: not-allowed;
    }
    button.secondary {
      background: #fff;
      color: #555;
      border: 1px solid #ccc;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      transition: background 0.2s;
    }
    button.secondary:hover { background: #f0f0f0; }
    .options {
      margin-top: 12px;
      padding: 10px;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      text-align: left;
      font-size: 12px;
    }
    .options label {
      display: block;
      margin-bottom: 4px;
      color: #555;
      font-weight: 500;
    }
    .options input[type="text"],
    .options input[type="number"] {
      width: 100%;
      box-sizing: border-box;
      padding: 5px 7px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 12px;
      font-family: inherit;
    }
    .options .row { margin-bottom: 10px; }
    .options .row:last-child { margin-bottom: 0; }
    .options .input-group {
      display: flex;
      gap: 4px;
    }
    .options .input-group input { flex: 1; }
    .options .hint {
      font-size: 10px;
      color: #888;
      margin-top: 3px;
    }
    .options .preview {
      font-size: 10px;
      color: #888;
      margin-top: 5px;
      padding: 4px 6px;
      background: #f5f5f5;
      border-radius: 3px;
      word-break: break-all;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
    }
    .footer {
      font-size: 11px;
      color: #777;
      margin-top: 12px;
    }
    .status {
      font-size: 11px;
      color: #555;
      margin-top: 8px;
      min-height: 14px;
    }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .checkbox-row input[type="checkbox"] { margin: 0; }
    .checkbox-row label { margin: 0; cursor: pointer; }
  </style>
</head>
<body>
  <h2 id="popup-title">Pinterest Downloader</h2>
  <button id="download-btn" class="primary">Baixar Imagens Visíveis</button>
  <div id="status" class="status"></div>

  <div class="options">
    <div class="row">
      <label for="opt-folder" id="label-folder">Pasta de destino</label>
      <div class="input-group">
        <input type="text" id="opt-folder" placeholder="Pinterest" maxlength="100">
        <button type="button" id="pick-folder-btn" class="secondary" title="Selecionar pasta">📁</button>
      </div>
      <div class="preview" id="folder-preview">Downloads/Pinterest/</div>
    </div>

    <div class="row">
      <label for="opt-max-pins" id="label-max-pins">Quantidade máxima de pins</label>
      <input type="number" id="opt-max-pins" min="0" max="9999" step="1" value="0">
      <div class="hint" id="hint-max-pins">0 = sem limite (baixa todos)</div>
    </div>

    <div class="row">
      <label for="opt-concurrent" id="label-concurrent">Downloads paralelos</label>
      <input type="number" id="opt-concurrent" min="1" max="12" step="1" value="6">
    </div>
  </div>

  <div class="footer" id="popup-footer">Versão Pro 2.0.0</div>
  <script src="lib/i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
