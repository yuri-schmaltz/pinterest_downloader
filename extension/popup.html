<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 260px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f9f9f9;
      color: #333;
      text-align: center;
    }
    h2 {
      font-size: 15px;
      margin: 0 0 12px 0;
      color: #e60023;
    }
    button.primary {
      background: #e60023;
      color: white;
      border: none;
      padding: 10px 14px;
      width: 100%;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.2s;
    }
    button.primary:hover { background: #ad081b; }
    button.primary:disabled {
      background: #888;
      cursor: not-allowed;
    }
    .options {
      margin-top: 12px;
      padding: 10px;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      text-align: left;
      font-size: 12px;
    }
    .options label {
      display: block;
      margin-bottom: 4px;
      color: #555;
      font-weight: 500;
    }
    .options input[type="text"],
    .options input[type="number"] {
      width: 100%;
      box-sizing: border-box;
      padding: 5px 7px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 12px;
      font-family: inherit;
    }
    .options .row { margin-bottom: 8px; }
    .footer {
      font-size: 11px;
      color: #777;
      margin-top: 12px;
    }
    .status {
      font-size: 11px;
      color: #555;
      margin-top: 8px;
      min-height: 14px;
    }
  </style>
</head>
<body>
  <h2 id="popup-title">Pinterest Downloader</h2>
  <button id="download-btn" class="primary">Baixar Imagens Visíveis</button>
  <div id="status" class="status"></div>

  <div class="options">
    <div class="row">
      <label for="opt-folder" id="label-folder">Pasta de destino</label>
      <input type="text" id="opt-folder" placeholder="Pinterest" maxlength="100">
    </div>
    <div class="row">
      <label for="opt-concurrent" id="label-concurrent">Downloads paralelos</label>
      <input type="number" id="opt-concurrent" min="1" max="12" step="1">
    </div>
  </div>

  <div class="footer" id="popup-footer">Versão Pro 2.0.0</div>
  <script src="lib/i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
