<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 220px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f9f9f9;
      color: #333;
      text-align: center;
    }
    h2 {
      font-size: 15px;
      margin-bottom: 12px;
      color: #e60023;
    }
    button {
      background: #e60023;
      color: white;
      border: none;
      padding: 10px 14px;
      width: 100%;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.2s;
    }
    button:hover {
      background: #ad081b;
    }
    .footer {
      font-size: 11px;
      color: #777;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <h2>Pinterest Downloader</h2>
  <button id="download-btn">Baixar Imagens Visíveis</button>
  <div class="footer">Versão Pro 2.0.0</div>
  <script src="popup.js"></script>
</body>
</html>
