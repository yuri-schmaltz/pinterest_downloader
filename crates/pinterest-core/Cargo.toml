[package]
name = "pinterest-core"
version = "2.0.5"
edition = "2021"
authors = ["Yuri Schmaltz"]
description = "Core library for Pinterest Board Downloader in Rust"
license = "MIT"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "cookies"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
url = "2.5"
futures = "0.3"
sanitize-filename = "0.5"
percent-encoding = "2.3"
unicode-normalization = "0.1"
tempfile = "3"
httpdate = "1"
sysinfo = { version = "0.40", default-features = false, features = ["system", "component"] }
scraper = "0.26"
tokio-util = { version = "0.7", features = ["rt"] }
pinterest-browser = { path = "../pinterest-browser", optional = true }

[features]
default = []
browser = ["dep:pinterest-browser"]
