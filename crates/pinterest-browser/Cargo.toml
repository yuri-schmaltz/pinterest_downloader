[package]
name = "pinterest-browser"
version = "2.0.5"
edition = "2021"
license = "MIT"
description = "Chromium lifecycle and bounded CDP snapshots for Pinterest Downloader"

[dependencies]
chromiumoxide = { version = "0.9.1", default-features = false, features = ["bytes"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tempfile = "3"
url = "2"
base64 = "0.22"
