[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pinterest-board-downloader"
version = "2.0.3"
description = "Ferramenta para baixar imagens de quadros do Pinterest via CLI ou GUI."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Yuri Schmaltz", email = "yuri-schmaltz@users.noreply.github.com"}
]
dependencies = [
    "requests>=2.31.0",
    "playwright>=1.45.0",
    "PyQt6>=6.6.0",
    "psutil>=5.9.0",
]
keywords = ["pinterest", "downloader", "scraper", "playwright", "pyqt6"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Multimedia :: Graphics",
]

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pytest>=7.0.0",
    "pytest-qt>=4.2.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
pinterest-board-dl = "pinterest_board_dl:main"
pinterest-board-gui = "pinterest_board_gui:run"

[project.urls]
Homepage = "https://github.com/yuri-schmaltz/pinterest_downloader"
Repository = "https://github.com/yuri-schmaltz/pinterest_downloader.git"
Issues = "https://github.com/yuri-schmaltz/pinterest_downloader/issues"

# The application lives in src/ as loose modules, not as a package: the
# modules import each other flatly ("from json_logger import ..."), so they
# have to be installed as top-level modules. Without this, setuptools'
# auto-discovery finds nothing and `pip install .` installs an empty
# distribution.
[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
    "pinterest_board_dl",
    "pinterest_board_gui",
    "adaptive_workers",
    "rate_limiter",
    "json_logger",
]

[tool.black]
line-length = 120
target-version = ['py310', 'py311', 'py312']
extend-exclude = '''
/(
  # diretórios
  \.eggs
  | \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "C",    # flake8-comprehensions
    "B",    # flake8-bugbear
]
ignore = [
    "E501",  # line too long (controlled by black)
    # Complexidade ciclomática (C901). O scraper do Pinterest é
    # inerentemente branch-heavy: fechamento de popups, lazy-load, retries,
    # scroll-stability e detecção de fim de página. São 8 funções com
    # complexidade entre 14 e 63 -- dívida conhecida, não um bug.
    # Refatorá-las é um trabalho à parte e não deve bloquear o pipeline.
    # A regra continua valendo para código NOVO: use
    #   ruff check --select C901 <arquivo>
    # quando adicionar função nova e mantenha a complexidade baixa.
    "C901",
]

[tool.ruff.lint.isort]
known-first-party = ["pinterest_board_dl", "pinterest_board_gui"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["src"]
addopts = "-v --tb=short"
