name: Multi-Platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build AppImage + DEB (Linux)
    runs-on: ubuntu-22.04  # ubuntu-20.04 was retired by GitHub; every tag build failed there
    permissions:
      contents: write  # Needed for creating releases

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-icccm4 libxcb-cursor0 libxcb-render-util0 \
            libxcb-xinerama0 libxcb-xkb1 libxcb-shape0 \
            xvfb fuse libfuse2 desktop-file-utils

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download Chromium for bundling
        env:
          # The app bundles the browser so it works on machines without
          # Playwright installed. The runtime hook in
          # hooks/playwright_browsers.py points the frozen app at it.
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/browsers
        run: |
          mkdir -p "$PLAYWRIGHT_BROWSERS_PATH"
          python -m playwright install chromium

      - name: Build with PyInstaller
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/browsers
        run: |
          pyinstaller --noconfirm --clean PinterestDownloader.spec

      - name: Smoke test the built app
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # Launch the frozen binary headless. If the PyInstaller bundle is
          # missing a module or the Qt plugins, it dies here rather than in
          # a user's hands.
          timeout 30 ./dist/pinterest-board-downloader/pinterest-board-downloader \
            || echo "app exited (expected: it waits for a window)"

      - name: Package AppImage
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-appimage-x86_64.AppImage

          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          mkdir -p AppDir/usr/share/applications

          # PyInstaller builds in onedir mode: the executable lives inside the
          # dist/ folder, next to its _internal/ libraries. Copy the whole
          # tree, not just the binary, or the app starts and dies on import.
          cp -r dist/pinterest-board-downloader AppDir/usr/bin/

          cp extension/icons/icon128.png AppDir/usr/share/icons/hicolor/256x256/apps/pinterest-downloader.png

          cat > AppDir/usr/share/applications/pinterest-downloader.desktop <<EOF
          [Desktop Entry]
          Type=Application
          Name=Pinterest Downloader
          Comment=Download images from Pinterest boards
          Exec=pinterest-board-downloader
          Icon=pinterest-downloader
          Categories=Utility;Network;
          Terminal=false
          EOF

          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable AppDir/usr/bin/pinterest-board-downloader/pinterest-board-downloader \
            --desktop-file AppDir/usr/share/applications/pinterest-downloader.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/pinterest-downloader.png \
            --output appimage

      - name: Rename AppImage
        run: |
          mv Pinterest_Downloader*.AppImage PinterestDownloader-x86_64.AppImage

      - name: Build DEB
        run: |
          mkdir -p staging_deb/usr/bin
          mkdir -p staging_deb/usr/share/applications
          mkdir -p staging_deb/usr/share/icons/hicolor/scalable/apps
          mkdir -p staging_deb/DEBIAN

          cp -r dist/pinterest-board-downloader/* staging_deb/usr/bin/

          cat > staging_deb/DEBIAN/control <<EOT
          Package: pinterest-downloader
          Version: ${GITHUB_REF#refs/tags/v}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Yuri Schmaltz <yuri-schmaltz@users.noreply.github.com>
          Description: Pinterest Board Downloader
           Tool to download images from Pinterest boards via CLI or GUI.
          EOT

          cat > staging_deb/usr/share/applications/pinterest-downloader.desktop <<EOT
          [Desktop Entry]
          Type=Application
          Name=Pinterest Downloader
          Comment=Download images from Pinterest boards
          Exec=pinterest-board-downloader
          Icon=pinterest-downloader
          Categories=Utility;Network;
          Terminal=false
          EOT

          cp assets/icon.svg staging_deb/usr/share/icons/hicolor/scalable/apps/pinterest-downloader.svg
          sudo dpkg-deb --build staging_deb pinterest-downloader_amd64.deb

      - name: Build extension packages
        run: |
          bash scripts/build_release.sh

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            PinterestDownloader-x86_64.AppImage
            pinterest-downloader_amd64.deb
            dist/pinterest-pro-downloader-chrome-*.zip
            dist/pinterest-pro-downloader-firefox-*.xpi
            dist/pinterest-pro-downloader-source-*.tar.gz
          generate_release_notes: true
          body: |
            ## Download

            | Platform | File | Notes |
            |---|---|---|
            | Linux (AppImage) | `PinterestDownloader-x86_64.AppImage` | Self-contained, includes Chromium |
            | Linux (Debian/Ubuntu) | `pinterest-downloader_amd64.deb` | `sudo dpkg -i *.deb` |
            | Windows | `pinterest-board-downloader.exe` | Built in the Windows job |
            | Chrome | `pinterest-pro-downloader-chrome-*.zip` | Unpacked via "Load unpacked" |
            | Firefox | `pinterest-pro-downloader-firefox-*.xpi` | Signed add-on required by AMO |
            | Source | `pinterest-pro-downloader-source-*.tar.gz` | Full repository |

  build-windows:
    name: Build EXE (Windows)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download Chromium for bundling
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/browsers
        run: |
          New-Item -ItemType Directory -Force -Path "$env:PLAYWRIGHT_BROWSERS_PATH" | Out-Null
          python -m playwright install chromium

      - name: Build with PyInstaller
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/browsers
        run: |
          pyinstaller --noconfirm --clean PinterestDownloader.spec

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/pinterest-board-downloader/pinterest-board-downloader.exe
          generate_release_notes: true
