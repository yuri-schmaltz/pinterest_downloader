name: Tests & Quality

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Instala o projeto em modo editavel + os extras de dev (pytest,
        # black, ruff, mypy). Como pytest nao esta em requirements.txt --
        # ele vive no extra [dev] do pyproject -- usar apenas
        # 'pip install -r requirements.txt' deixava o job sem pytest.
        # Instalar o proprio projeto aqui tambem valida o packaging.
        pip install -e ".[dev]"

    - name: Install Qt system libraries
      run: |
        # pytest-qt imports QtGui when pytest configures, and libQt6Gui
        # links against libEGL -- which the GitHub runner image does not
        # have. 'playwright install --with-deps' covers the browser's
        # dependencies, not Qt's. The 'offscreen' platform plugin still
        # needs the library present.
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libegl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 \
          libxcb-icccm4 libxcb-cursor0 libxcb-render-util0 \
          libxcb-xinerama0 libxcb-xkb1 libxcb-shape0 libxcb-image0

    - name: Install Chromium for the scraper tests
      run: |
        # The scraper tests drive a real Chromium against a local HTML
        # fixture (file://) -- no network, but a real browser is needed.
        python -m playwright install --with-deps chromium

    - name: Run unit tests
      env:
        # The GUI tests need a Qt platform plugin but not a display.
        QT_QPA_PLATFORM: offscreen
      run: |
        # tests/conftest.py and pyproject's pythonpath=["src"] both put src/
        # on the path. The suite covers src/ + tests/ only -- no network, so
        # it is fast and deterministic.
        python -m pytest tests/ -v --tb=short

    - name: Check code syntax
      run: |
        python -m py_compile src/pinterest_board_dl.py
        python -m py_compile src/pinterest_board_gui.py
        python -m py_compile src/json_logger.py
        python -m py_compile src/adaptive_workers.py
        python -m py_compile src/rate_limiter.py

  smoke-import:
    name: Smoke Import (no display, no network)
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Install Qt system libraries
      run: |
        # pytest-qt imports QtGui when pytest configures, and libQt6Gui
        # links against libEGL -- which the GitHub runner image does not
        # have. 'playwright install --with-deps' covers the browser's
        # dependencies, not Qt's. The 'offscreen' platform plugin still
        # needs the library present.
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libegl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 \
          libxcb-icccm4 libxcb-cursor0 libxcb-render-util0 \
          libxcb-xinerama0 libxcb-xkb1 libxcb-shape0 libxcb-image0

    - name: Verify package import (catches missing exports)
      run: |
        # Regression gate: catches ImportError, missing symbols, removed
        # exports, etc. This is the gate that would have caught the
        # src/ restructure breaking every import in the codebase.
        PYTHONPATH=src python -c "
        import pinterest_board_dl
        from pinterest_board_dl import (
            DownloadOptions, download_board, download_user_boards,
            collect_board_urls, collect_pin_links, resolve_images,
            download_media, fetch_pin_media, PrivateProfileError,
            create_session, normalize_url, parse_pin_count,
            safe_name, slugify, get_cache_dir, get_config_dir,
        )
        from adaptive_workers import AdaptiveWorkerManager, get_adaptive_manager
        from rate_limiter import RateLimiter, RateLimitConfig, get_rate_limiter
        from json_logger import get_logger
        print('OK: all modules importable, all public symbols present')
        "

    - name: Verify CLI entry point
      run: |
        PYTHONPATH=src python src/pinterest_board_dl.py --help

  extension:
    name: Extension Integrity
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Verify every file referenced by the extension is tracked
      run: |
        # The extension used to reference lib/i18n.js, a file that the
        # .gitignore rule 'lib/' kept out of the repository. The published
        # zips were built on a machine that had it locally; a clean clone
        # produced a broken extension. This gate makes that impossible.
        python - <<'PY'
        import json, re, subprocess
        from pathlib import Path

        ext = Path("extension")
        manifest = json.loads((ext / "manifest.json").read_text())

        referenced = []
        for entry in manifest.get("content_scripts", []):
            referenced += entry.get("js", [])
        if "background" in manifest:
            referenced.append(manifest["background"].get("service_worker", ""))
        if "action" in manifest:
            referenced.append(manifest["action"].get("default_popup", ""))

        popup = ext / "popup.html"
        if popup.exists():
            referenced += re.findall(r'<script[^>]+src="([^"]+)"', popup.read_text())

        missing = [r for r in filter(None, referenced) if not (ext / r).exists()]
        if missing:
            print("ERROR: manifest/popup reference files that are not in the repo:")
            for m in missing:
                print(f"  - extension/{m}")
            raise SystemExit(1)
        print(f"OK: all {len(referenced)} referenced extension files are present")
        PY

    - name: Verify referenced files are actually tracked by git
      run: |
        # A file can exist on disk and still be untracked (that is exactly
        # what happened with lib/i18n.js). Check git's own view.
        git ls-files --error-unmatch extension/lib/i18n.js > /dev/null
        echo "OK: extension/lib/i18n.js is tracked by git"

    - name: Build extension package and verify its contents
      run: |
        bash scripts/build_release.sh
        python - <<'PY'
        import zipfile
        from pathlib import Path

        zips = list(Path("dist").glob("*.zip"))
        if not zips:
            raise SystemExit("ERROR: no extension zip was produced")
        for z in zips:
            with zipfile.ZipFile(z) as zf:
                names = zf.namelist()
            if not any(n.endswith("lib/i18n.js") for n in names):
                raise SystemExit(f"ERROR: {z.name} is missing lib/i18n.js")
            print(f"OK: {z.name} contains lib/i18n.js ({len(names)} entries)")
        PY

    - name: Test the extension i18n
      run: |
        # The extension had no tests at all. This covers the translation
        # layer, which has two code paths: with chrome.i18n (real browser)
        # and without it (the Portuguese fallback dictionary).
        node tests/test_extension_i18n.js

    - name: Test the extension pin URL helpers
      run: |
        # A transformacao de URL decide qual imagem o usuario baixa. Um
        # erro aqui significa resolucao errada.
        node tests/test_extension_pins.js

  version:
    name: Version in sync
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Check that manifest and pyproject agree
      run: |
        # The version lived in three places (pyproject, manifest, tag) and
        # drifted: the v2.0.1 release shipped assets named v2.0.0.
        python scripts/sync_version.py --check

  lint:
    name: Code Quality (Black, Ruff, MyPy)
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Check formatting with Black
      run: |
        black --check --diff --line-length 120 src/ tests/ scripts/

    - name: Lint with Ruff
      run: |
        ruff check src/ tests/ scripts/

    - name: Type check with MyPy
      run: |
        mypy src/pinterest_board_dl.py --ignore-missing-imports
