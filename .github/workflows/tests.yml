name: Tests & Quality

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Run Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # GUI dep for compile check (PyQt6 is optional at import time but py_compile needs it)
        pip install PyQt6

    - name: Run unit tests (pytest)
      run: |
        # Set PYTHONPATH so tests/ can import the src/ package
        PYTHONPATH=src python -m pytest tests/ -v --tb=short

    - name: Check code syntax
      run: |
        python -m py_compile src/pinterest_board_dl.py
        python -m py_compile src/pinterest_board_gui.py
        python -m py_compile src/json_logger.py
        python -m py_compile src/adaptive_workers.py
        python -m py_compile src/rate_limiter.py

  smoke-import:
    name: Smoke Import (no display, no network)
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install PyQt6

    - name: Verify package import (catches missing exports)
      run: |
        # Regression gate: catches ImportError, missing _, broken __all__,
        # removed symbols, etc. Lesson: pires-forge v1.3.0/v1.3.1/v1.3.2 —
        # three releases shipped with ImportErrors that no other gate caught.
        PYTHONPATH=src python -c "
        import pinterest_board_dl
        from pinterest_board_dl import (
            DownloadOptions, download_board, download_user_boards,
            collect_board_urls, collect_pin_links, resolve_images,
            download_media, fetch_pin_media, PrivateProfileError,
            create_session, normalize_url, parse_pin_count,
            safe_name, slugify, get_cache_dir, get_config_dir,
        )
        from adaptive_workers import AdaptiveWorkerManager, get_adaptive_manager
        from rate_limiter import RateLimiter, RateLimitConfig, get_rate_limiter
        from json_logger import get_logger
        print('OK: all modules importable, all public symbols present')
        "

  lint:
    name: Code Quality (Black, Ruff, MyPy)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install linting tools
      run: |
        pip install black ruff mypy
        pip install PyQt6

    - name: Check formatting with Black
      run: |
        black --check --diff --line-length 120 src/ tests/

    - name: Lint with Ruff
      run: |
        ruff check src/ tests/ --select E,W,F

    - name: Type check with MyPy
      run: |
        mypy src/pinterest_board_dl.py --ignore-missing-imports
