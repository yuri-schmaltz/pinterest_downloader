name: Tests & Benchmarks

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install chromium
    
    - name: Run smoke tests
      run: |
        python test_patches.py
    
    - name: Check code syntax
      run: |
        python -m py_compile pinterest_board_dl.py
        python -m py_compile json_logger.py
        python -m py_compile adaptive_workers.py
        python -m py_compile diagnostics.py
  
  benchmark:
    name: Performance Benchmark
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for comparison
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install chromium
    
    - name: Run diagnostics benchmark
      run: |
        python diagnostics.py > benchmark_results.txt
        cat benchmark_results.txt
    
    - name: Save baseline (main branch only)
      if: github.ref == 'refs/heads/main'
      run: |
        mkdir -p .benchmarks
        cp diagnostics_baseline.json .benchmarks/baseline_${{ github.sha }}.json
        echo "${{ github.sha }}" > .benchmarks/latest_baseline.txt
    
    - name: Compare with baseline
      run: |
        python -c "
        import json
        from pathlib import Path
        
        baseline_file = Path('diagnostics_baseline.json')
        if baseline_file.exists():
            baseline = json.loads(baseline_file.read_text())
            
            print('\n📊 BENCHMARK COMPARISON')
            print('=' * 60)
            print(f'Version: {baseline.get(\"version\", \"unknown\")}')
            print(f'Tests: {baseline.get(\"total_checks\", 0)}')
            print(f'Passed: {baseline.get(\"passed_checks\", 0)}')
            print(f'Failed: {baseline.get(\"failed_checks\", 0)}')
            
            if 'performance_summary' in baseline:
                perf = baseline['performance_summary']
                print(f'\n⚡ PERFORMANCE')
                print(f'Total speedup: {perf.get(\"total_speedup_percent\", 0)}%')
                
                if 'ondas' in perf:
                    print('\n🎯 ONDAS CONTRIBUTIONS:')
                    for onda, data in sorted(perf['ondas'].items()):
                        print(f'  {onda}: {data.get(\"speedup_percent\", 0)}%')
        else:
            print('⚠️  No baseline found')
        "
    
    - name: Upload benchmark artifacts
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results-py${{ matrix.python-version }}
        path: |
          benchmark_results.txt
          diagnostics_baseline.json
        retention-days: 30
    
    - name: Comment PR with results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const results = fs.readFileSync('benchmark_results.txt', 'utf8');
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `## 📊 Benchmark Results\n\n\`\`\`\n${results}\n\`\`\``
          });

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install linting tools
      run: |
        pip install black ruff mypy
    
    - name: Check formatting with Black
      run: |
        black --check --diff --line-length 120 *.py || true
    
    - name: Lint with Ruff
      run: |
        ruff check *.py --select E,W,F || true
    
    - name: Type check with MyPy
      run: |
        mypy pinterest_board_dl.py --ignore-missing-imports || true
