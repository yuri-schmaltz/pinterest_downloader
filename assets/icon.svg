<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E60023;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#BD081C;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pinGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F0F0F0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Rounded rectangle background -->
  <rect x="0" y="0" width="256" height="256" rx="48" ry="48" fill="url(#bgGradient)"/>
  
  <!-- Pinterest-style pin icon with download arrow -->
  <g transform="translate(128, 128) scale(1.4)">
    <!-- Pin circle -->
    <circle cx="0" cy="-20" r="45" fill="url(#pinGradient)" stroke="#E60023" stroke-width="3"/>
    
    <!-- Download arrow inside pin -->
    <g transform="translate(0, -20)">
      <!-- Arrow shaft -->
      <rect x="-6" y="-20" width="12" height="35" fill="#E60023" rx="2"/>
      <!-- Arrow head -->
      <path d="M -18,10 L 0,28 L 18,10 Z" fill="#E60023"/>
    </g>
    
    <!-- Pin point -->
    <path d="M -8,30 L 0,60 L 8,30 Q 8,25 0,25 Q -8,25 -8,30 Z" fill="url(#pinGradient)" stroke="#E60023" stroke-width="2"/>
    
    <!-- Small accent dots -->
    <circle cx="-55" cy="-55" r="8" fill="#FFFFFF" opacity="0.6"/>
    <circle cx="55" cy="-45" r="6" fill="#FFFFFF" opacity="0.5"/>
    <circle cx="50" cy="40" r="7" fill="#FFFFFF" opacity="0.4"/>
  </g>
</svg>
